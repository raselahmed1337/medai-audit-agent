<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MedAI Research Agent — Approval Console</title>
<style>
  :root {
    --bg:#f5f7fa; --panel:#ffffff; --panel-2:#f8fafc; --ink:#0f1b26; --muted:#64748b;
    --line:#e4eaf0; --accent:#0891b2; --accent-soft:#e0f4f8; --accent-ink:#fff;
    --ok:#059669; --ok-bg:#ecfdf5; --warn:#b45309; --warn-bg:#fffbeb;
    --bad:#dc2626; --bad-bg:#fef2f2; --shadow:0 1px 3px rgba(15,27,38,.07),0 8px 24px rgba(15,27,38,.05);
    --radius:14px;
  }
  [data-theme="dark"] {
    --bg:#0b141c; --panel:#111f2b; --panel-2:#0e1a24; --ink:#e6eef4; --muted:#8aa0b2;
    --line:#1e3242; --accent:#22d3ee; --accent-soft:#0e2a33; --accent-ink:#06222b;
    --ok:#34d399; --ok-bg:#0a2b21; --warn:#fbbf24; --warn-bg:#2d2205;
    --bad:#f87171; --bad-bg:#2d0f0f;
    --shadow:0 1px 3px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.3);
  }
  * { box-sizing:border-box; }
  html,body { height:100%; }
  body { margin:0; font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,sans-serif;
         background:var(--bg); color:var(--ink); font-size:14px; }
  .app { display:grid; grid-template-columns:330px 1fr; height:100vh; }
  @media (max-width:900px){ .app { grid-template-columns:1fr; height:auto; } }

  /* ---------- sidebar ---------- */
  aside { background:var(--panel); border-right:1px solid var(--line);
          display:flex; flex-direction:column; overflow:hidden; }
  .brand { display:flex; align-items:center; gap:10px; padding:18px 18px 14px; }
  .brand .logo { width:34px; height:34px; border-radius:10px; flex:0 0 auto;
    background:linear-gradient(135deg,#0891b2,#0e7490); display:grid; place-items:center; }
  .brand .logo svg { width:18px; height:18px; stroke:#fff; }
  .brand h1 { font-size:15px; margin:0; font-weight:700; letter-spacing:-.01em; }
  .brand p { margin:1px 0 0; font-size:11px; color:var(--muted); }
  .brand .spacer { flex:1; }
  .iconbtn { background:var(--panel-2); border:1px solid var(--line); color:var(--muted);
             border-radius:9px; width:30px; height:30px; cursor:pointer; display:grid; place-items:center; }
  .iconbtn:hover { color:var(--accent); border-color:var(--accent); }
  .iconbtn svg { width:15px; height:15px; }

  .newrun { padding:4px 18px 14px; border-bottom:1px solid var(--line); }
  .field { margin-bottom:10px; }
  .field label { display:block; font-size:11px; font-weight:600; color:var(--muted);
                 text-transform:uppercase; letter-spacing:.05em; margin-bottom:5px; }
  input[type=text] { width:100%; padding:9px 11px; border:1px solid var(--line); border-radius:9px;
                     font-size:13.5px; background:var(--panel-2); color:var(--ink); }
  input[type=text]:focus { outline:none; border-color:var(--accent); }
  .toggle { display:flex; align-items:center; gap:8px; font-size:13px; cursor:pointer; user-select:none; }
  .toggle input { accent-color:var(--accent); width:15px; height:15px; }
  .toggle .src { color:var(--muted); font-size:11px; }
  .slider-row { display:flex; align-items:center; gap:10px; }
  .slider-row input[type=range] { flex:1; accent-color:var(--accent); }
  .slider-row b { font-size:12.5px; min-width:34px; text-align:right; }
  .btn { border:0; border-radius:9px; padding:10px 14px; font-size:13.5px; font-weight:650;
         cursor:pointer; transition:filter .15s; }
  .btn:hover { filter:brightness(1.08); }
  .btn-primary { background:var(--accent); color:var(--accent-ink); width:100%; }
  .btn-ok { background:var(--ok); color:#fff; }
  .btn-bad { background:transparent; color:var(--bad); border:1.5px solid var(--bad); }

  .runshdr { display:flex; align-items:center; justify-content:space-between;
             padding:14px 18px 8px; }
  .runshdr h2 { font-size:11px; text-transform:uppercase; letter-spacing:.06em;
                color:var(--muted); margin:0; }
  .filters { display:flex; gap:5px; padding:0 18px 10px; flex-wrap:wrap; }
  .fchip { font-size:11.5px; font-weight:600; padding:4px 10px; border-radius:99px;
           border:1px solid var(--line); background:var(--panel-2); color:var(--muted);
           cursor:pointer; }
  .fchip.on { background:var(--accent-soft); color:var(--accent); border-color:var(--accent); }
  .runlist { list-style:none; margin:0; padding:2px 12px 16px; overflow-y:auto; flex:1; }
  .runlist li { padding:10px 10px; border-radius:10px; cursor:pointer; margin-bottom:2px;
                border:1px solid transparent; }
  .runlist li:hover { background:var(--panel-2); }
  .runlist li.sel { background:var(--accent-soft); border-color:var(--accent); }
  .runlist .rq { font-size:13px; font-weight:600; white-space:nowrap; overflow:hidden;
                 text-overflow:ellipsis; }
  .runlist .rm { display:flex; justify-content:space-between; align-items:center;
                 margin-top:4px; font-size:11px; color:var(--muted); }
  .runlist .rm .right { display:flex; align-items:center; gap:6px; }

  /* delete affordance */
  .del { background:transparent; border:0; color:var(--muted); cursor:pointer;
         opacity:0; transition:.15s; padding:3px; border-radius:6px;
         display:grid; place-items:center; line-height:0; }
  .runlist li:hover .del { opacity:1; }
  .del:hover { color:var(--bad); background:var(--bad-bg); }
  .del.confirm { opacity:1; color:#fff; background:var(--bad);
                 font-size:10.5px; font-weight:750; padding:3px 8px; line-height:1.4; }
  .del svg { width:13px; height:13px; }
  .btn-danger-ghost { background:transparent; border:1px solid var(--line); color:var(--muted);
                      font-size:12px; font-weight:650; padding:6px 13px; border-radius:99px;
                      cursor:pointer; display:inline-flex; align-items:center; gap:6px; }
  .btn-danger-ghost:hover { color:var(--bad); border-color:var(--bad); }
  .btn-danger-ghost.confirm { color:#fff; background:var(--bad); border-color:var(--bad); }
  .btn-danger-ghost svg { width:13px; height:13px; }

  /* ---------- status pills ---------- */
  .pill { display:inline-flex; align-items:center; gap:5px; font-size:11px; font-weight:700;
          padding:3px 9px; border-radius:99px; white-space:nowrap; }
  .pill .dot { width:6px; height:6px; border-radius:99px; background:currentColor; }
  .pill.p-run { background:var(--accent-soft); color:var(--accent); }
  .pill.p-run .dot { animation:pulse 1.2s infinite; }
  .pill.p-pend { background:var(--warn-bg); color:var(--warn); }
  .pill.p-ok { background:var(--ok-bg); color:var(--ok); }
  .pill.p-end { background:var(--panel-2); color:var(--muted); }
  .pill.p-bad { background:var(--bad-bg); color:var(--bad); }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.25} }
  [data-theme="dark"] .pill.p-run .dot { animation:none; }

  /* ---------- main ---------- */
  main { overflow-y:auto; padding:22px 26px 40px; }
  .topbar { display:flex; align-items:flex-start; gap:14px; flex-wrap:wrap; margin-bottom:16px; }
  .topbar h2 { margin:0; font-size:19px; font-weight:700; letter-spacing:-.01em; }
  .topbar .meta { display:flex; gap:6px; flex-wrap:wrap; margin-top:7px; }
  .mchip { font-size:11.5px; color:var(--muted); background:var(--panel); border:1px solid var(--line);
           padding:3px 10px; border-radius:99px; }
  .topbar .spacer { flex:1; }

  .card { background:var(--panel); border:1px solid var(--line); border-radius:var(--radius);
          box-shadow:var(--shadow); padding:18px 20px; margin-bottom:14px; }
  .card h3 { margin:0 0 12px; font-size:12px; text-transform:uppercase; letter-spacing:.07em;
             color:var(--muted); }

  /* stepper */
  .stepper { display:flex; align-items:flex-start; margin:6px 0 2px; }
  .step { flex:1; text-align:center; position:relative; }
  .step .node { width:26px; height:26px; border-radius:99px; margin:0 auto; display:grid;
                place-items:center; font-size:12px; font-weight:800;
                background:var(--panel-2); color:var(--muted); border:2px solid var(--line); }
  .step .lbl { font-size:11px; font-weight:600; color:var(--muted); margin-top:6px;
               text-transform:uppercase; letter-spacing:.04em; }
  .step::before { content:""; position:absolute; top:13px; left:-50%; width:100%; height:2px;
                  background:var(--line); z-index:0; }
  .step:first-child::before { display:none; }
  .step.done .node, .step.fail .node { border-color:transparent; z-index:1; position:relative; }
  .step.done .node { background:var(--ok); color:#fff; }
  .step.done::before, .step.act::before { background:var(--ok); }
  .step.fail .node { background:var(--bad); color:#fff; }
  .step.fail::before { background:var(--bad); }
  .step.act .node { border-color:var(--accent); color:var(--accent); background:var(--accent-soft);
                    z-index:1; position:relative; animation:pulse 1.4s infinite; }
  .step.act .lbl { color:var(--accent); }
  .step .node svg { width:12px; height:12px; stroke:#fff; }

  /* approval card */
  .approval { border:1.5px solid var(--warn); }
  .approval .badge-ico { display:inline-flex; align-items:center; gap:8px; font-weight:700;
                         color:var(--warn); font-size:14px; margin-bottom:10px; }
  .kv { display:grid; grid-template-columns:120px 1fr; gap:6px 12px; font-size:13.5px; }
  .kv b { color:var(--muted); font-weight:600; }
  .btnrow { display:flex; gap:10px; margin-top:16px; }
  .btnrow .btn { flex:1; padding:11px; }
  .sig { margin-top:12px; }
  .sig input { max-width:260px; }

  /* report */
  .report { font-size:15px; line-height:1.6; }
  .report.big { font-size:17px; }
  .cites { display:flex; flex-wrap:wrap; gap:7px; margin-top:12px; }
  .cites a { font-size:12px; font-weight:650; color:var(--accent); text-decoration:none;
             background:var(--accent-soft); padding:5px 11px; border-radius:99px; }
  .cites a:hover { filter:brightness(.95); }
  .note { display:flex; gap:10px; align-items:flex-start; font-size:14px; line-height:1.5;
          color:var(--muted); }
  .note svg { width:17px; height:17px; flex:0 0 auto; margin-top:1px; stroke:var(--muted); }

  /* tabs */
  .tabs { display:flex; gap:2px; background:var(--panel-2); border:1px solid var(--line);
          border-radius:10px; padding:3px; width:max-content; margin-bottom:14px; }
  .tab { border:0; background:transparent; color:var(--muted); font-size:12.5px; font-weight:650;
         padding:7px 14px; border-radius:8px; cursor:pointer; }
  .tab.on { background:var(--panel); color:var(--ink); box-shadow:var(--shadow); }

  table { width:100%; border-collapse:collapse; font-size:12.5px; }
  td, th { text-align:left; padding:7px 9px; border-bottom:1px solid var(--line); vertical-align:top; }
  th { font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); }
  td.k { font-weight:650; white-space:nowrap; }
  td.d { color:var(--muted); word-break:break-all; }
  .srcb { font-size:10.5px; font-weight:700; color:var(--accent); background:var(--accent-soft);
          padding:2px 7px; border-radius:99px; display:inline-block; margin-top:3px; }

  /* paper overview */
  ol.refs { margin:0; padding-left:22px; }
  ol.refs li { margin-bottom:13px; font-size:13.5px; line-height:1.5; }
  ol.refs li a { color:var(--accent); text-decoration:none; font-weight:650; }
  ol.refs li a:hover { text-decoration:underline; }
  .eff { color:var(--accent); font-size:12.5px; font-weight:650; margin-top:3px; }
  .noeff { color:var(--muted); font-size:12px; margin-top:3px; font-style:italic; }
  .snippet { color:var(--muted); font-size:12px; margin-top:3px; line-height:1.5; }
  .cite-n { font-weight:750; color:var(--accent); font-size:12px; }
  .outline-h { font-weight:700; font-size:13.5px; margin:12px 0 5px; }
  .outline-b { margin:0 0 5px; font-size:13.5px; line-height:1.55; color:var(--ink); }
  .outline-b .cite-n { cursor:default; }
  .abstract-p { font-size:14px; line-height:1.7; }

  /* review article */
  .review-title { font-size:19px; font-weight:750; letter-spacing:-.02em; line-height:1.35;
                  margin:0 0 6px; }
  .review-meta { font-size:12px; color:var(--muted); margin-bottom:12px; }
  .review-sec { font-weight:750; font-size:13px; text-transform:uppercase; letter-spacing:.07em;
                color:var(--accent); margin:16px 0 6px; }
  .review-sub { font-weight:700; font-size:13px; margin:10px 0 3px; }
  .review-p { font-size:13.5px; line-height:1.65; margin:0 0 6px; }
  .review-li { font-size:13.5px; line-height:1.6; margin:0 0 4px; }
  .flow-box { fill:var(--panel-2); stroke:var(--accent); stroke-width:1.2; rx:8; }
  .flow-side { fill:var(--bad-bg); stroke:var(--bad); stroke-width:1; }
  .flow-text { font-size:12px; fill:var(--ink); font-weight:600; }
  .flow-sub { font-size:11px; fill:var(--muted); }
  .flow-arrow { stroke:var(--muted); stroke-width:1.4; }
  .flow-excl { font-size:11px; fill:var(--bad); font-weight:600; }

  /* forest plot */
  .forest-wrap { overflow-x:auto; }
  .forest-plot text { font-family:inherit; }
  .forest-plot .study-label { font-size:12px; fill:var(--ink); }
  .forest-plot .val-label { font-size:11.5px; fill:var(--muted); font-variant-numeric:tabular-nums; }
  .forest-plot .pooled-label { font-size:12px; font-weight:750; fill:var(--ink); }
  .forest-plot .axis-label { font-size:11px; fill:var(--muted); font-variant-numeric:tabular-nums; }
  .forest-plot .axis-caption { font-size:11px; fill:var(--muted); font-style:italic; }
  .forest-plot .ci-line { stroke:var(--accent); stroke-width:1.6; }
  .forest-plot .study-marker { fill:var(--accent); stroke:var(--panel); stroke-width:1; }
  .forest-plot .ref-line { stroke:var(--muted); stroke-width:1; stroke-dasharray:4 4; opacity:.7; }
  .forest-plot .pooled-diamond { fill:var(--accent); opacity:.92; }
  .forest-plot .fixed-diamond { fill:none; stroke:var(--muted); stroke-width:1.4; stroke-dasharray:3 2; }
  .forest-plot .pooled-row-line { stroke:var(--line); stroke-width:1; }
  .forest-header { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:8px; }
  a.plink { color:var(--accent); text-decoration:none; font-weight:650; }
  a.plink:hover { text-decoration:underline; }

  .badge { font-size:12px; font-weight:750; padding:4px 11px; border-radius:99px; display:inline-block; }
  .badge.ok { background:var(--ok-bg); color:var(--ok); }
  .badge.bad { background:var(--bad-bg); color:var(--bad); }

  .empty { min-height:60vh; display:grid; place-items:center; text-align:center; color:var(--muted); }
  .empty svg { width:44px; height:44px; stroke:var(--line); margin-bottom:10px; }
  .empty h3 { color:var(--ink); font-size:16px; margin:0 0 4px; text-transform:none;
              letter-spacing:0; }

  .toast { position:fixed; bottom:20px; right:20px; background:var(--ink); color:var(--bg);
           padding:11px 16px; border-radius:10px; font-size:13px; box-shadow:var(--shadow);
           opacity:0; transform:translateY(8px); transition:.25s; pointer-events:none; z-index:50; }
  .toast.show { opacity:1; transform:none; }
  .hint { font-size:12.5px; color:var(--muted); line-height:1.65; }
  .hint b { color:var(--ink); }
</style>
<style>
  /* ============ aurora-glass design layer ============ */
  :root {
    --bg:#eef1f8;
    --panel:rgba(255,255,255,.66);
    --panel-2:rgba(244,246,252,.8);
    --ink:#0a1220; --muted:#5c6c80;
    --line:rgba(13,32,56,.1);
    --accent:#0891b2; --accent-2:#6366f1;
    --accent-soft:rgba(8,145,178,.1);
    --ok:#059669; --ok-bg:rgba(5,150,105,.1);
    --warn:#c2620a; --warn-bg:rgba(217,119,6,.1);
    --bad:#dc2626; --bad-bg:rgba(220,38,38,.08);
    --radius:18px;
    --shadow:0 1px 2px rgba(2,10,26,.05), 0 16px 40px -12px rgba(2,10,26,.14);
    --glass-blur:blur(18px) saturate(1.35);
  }
  [data-theme="dark"] {
    --bg:#060a13;
    --panel:rgba(15,24,39,.62);
    --panel-2:rgba(20,31,48,.55);
    --ink:#e9f0f9; --muted:#8b9fb5;
    --line:rgba(148,170,200,.14);
    --accent:#22d3ee; --accent-2:#818cf8;
    --accent-soft:rgba(34,211,238,.1);
    --ok:#34d399; --ok-bg:rgba(52,211,153,.1);
    --warn:#fbbf24; --warn-bg:rgba(251,191,36,.09);
    --bad:#f87171; --bad-bg:rgba(248,113,113,.09);
    --shadow:0 1px 2px rgba(0,0,0,.5), 0 20px 48px -16px rgba(0,0,0,.55);
  }
  /* ambient aurora washes behind the whole app */
  body::before { content:""; position:fixed; inset:0; z-index:0; pointer-events:none;
    background:
      radial-gradient(48rem 30rem at 82% -12%, var(--accent-soft), transparent 65%),
      radial-gradient(42rem 28rem at -8% 108%, rgba(99,102,241,.09), transparent 62%);
  }
  [data-theme="dark"] body::before {
    background:
      radial-gradient(50rem 32rem at 84% -14%, rgba(34,211,238,.09), transparent 64%),
      radial-gradient(44rem 30rem at -10% 110%, rgba(129,140,248,.08), transparent 62%);
  }
  .app { position:relative; z-index:1; }
  ::selection { background:var(--accent-soft); }
  ::-webkit-scrollbar { width:9px; height:9px; }
  ::-webkit-scrollbar-thumb { background:var(--line); border-radius:99px; }
  ::-webkit-scrollbar-track { background:transparent; }
  :focus-visible { outline:2px solid var(--accent); outline-offset:2px; border-radius:8px; }

  /* glass panels */
  aside, .card { background:var(--panel); backdrop-filter:var(--glass-blur);
    -webkit-backdrop-filter:var(--glass-blur); border:1px solid var(--line); }
  aside { border-right:1px solid var(--line); }
  .card { border-radius:var(--radius); box-shadow:var(--shadow);
          transition:border-color .2s ease, box-shadow .2s ease; }

  .logo { background:linear-gradient(135deg, var(--accent), var(--accent-2));
          box-shadow:0 6px 18px -6px var(--accent); }
  .brand h1 { letter-spacing:-.02em; }

  /* buttons */
  .btn { transition:transform .16s ease, filter .16s ease, box-shadow .16s ease; }
  .btn:hover { transform:translateY(-1px); }
  .btn:active { transform:translateY(0); }
  .btn-primary { background:linear-gradient(135deg, var(--accent), var(--accent-2));
                 border:0; color:#fff; box-shadow:0 8px 20px -8px var(--accent); }
  [data-theme="dark"] .btn-primary { color:#06121a; }
  .btn-ok { box-shadow:0 8px 20px -8px var(--ok); }
  .btn-bad { background:transparent; }
  .btn-bad:hover { background:var(--bad-bg); transform:translateY(-1px); }

  /* run list */
  .runlist li { transition:background .15s ease, border-color .15s ease, transform .15s ease; }
  .runlist li:hover { transform:translateX(2px); }
  .runlist li.sel { box-shadow:inset 0 0 0 1px var(--accent); }

  /* status pills — soft translucent with ring */
  .pill { backdrop-filter:blur(6px); box-shadow:inset 0 0 0 1px var(--line); }

  /* stepper — gradient nodes, glowing active */
  .step .node { background:var(--panel-2); border:2px solid var(--line);
                transition:all .25s ease; }
  .step.done .node { background:linear-gradient(135deg, var(--ok), #0ea5a0); border-color:transparent;
                     box-shadow:0 4px 14px -4px var(--ok); }
  .step.done::before, .step.act::before { background:linear-gradient(90deg, var(--ok), var(--accent)); }
  .step.act .node { border-color:var(--accent); color:var(--accent);
                    background:var(--accent-soft); box-shadow:0 0 0 5px var(--accent-soft); }
  .step.fail .node { background:linear-gradient(135deg, var(--bad), #ef4444); border-color:transparent;
                     box-shadow:0 4px 14px -4px var(--bad); }
  .step.fail::before { background:linear-gradient(90deg, var(--bad), var(--bad-bg)); }
  .step .lbl { letter-spacing:.08em; }

  /* approval card — attention gradient */
  .approval { border:1.5px solid var(--warn);
    background:linear-gradient(160deg, var(--warn-bg), transparent 60%), var(--panel);
    box-shadow:0 0 0 4px var(--warn-bg), var(--shadow); }

  /* tabs */
  .tabs { background:var(--panel-2); backdrop-filter:blur(8px); }
  .tab { transition:color .15s ease, background .15s ease; }
  .tab.on { box-shadow:0 2px 10px -2px rgba(2,10,26,.25); }

  /* tables */
  table { font-variant-numeric:tabular-nums; }
  tbody tr, table tr:not(:first-child) { transition:background .12s ease; }
  table tr:hover td { background:color-mix(in srgb, var(--accent-soft) 40%, transparent); }

  /* chips & badges */
  .mchip, .fchip, .cites a { backdrop-filter:blur(6px); }
  .cites a { transition:transform .15s ease, filter .15s ease; }
  .cites a:hover { transform:translateY(-1px); filter:brightness(1.05); }

  /* filters */
  .fchip { transition:all .15s ease; }
  .fchip.on { box-shadow:0 4px 12px -6px var(--accent); }

  /* toast */
  .toast { background:linear-gradient(135deg, var(--ink), #1e293b); color:var(--bg);
           border:1px solid var(--line); }

  /* headings */
  .topbar h2 { letter-spacing:-.025em; }
  .card h3 { letter-spacing:.09em; }
  .abstract-p, .report { letter-spacing:-.005em; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation:none !important; transition:none !important; }
  }
</style>
</head>
<body>
<div class="app">
  <aside>
    <div class="brand">
      <div class="logo"><svg viewBox="0 0 24 24" fill="none" stroke-width="2.2"><path d="M12 3l7 3v6c0 4.5-3 7.5-7 9-4-1.5-7-4.5-7-9V6l7-3z" stroke-linejoin="round"/></svg></div>
      <div>
        <h1>MedAI Research Agent</h1>
        <p>Approval Console</p>
      </div>
      <div class="spacer"></div>
      <button class="iconbtn" id="themeBtn" title="Toggle theme"></button>
    </div>

    <div class="newrun">
      <div class="field">
        <label>Research query</label>
        <input type="text" id="query" placeholder="e.g. aspirin myocardial infarction risk"
               onkeydown="if(event.key==='Enter')submitRun()">
      </div>
      <div class="field">
        <label class="toggle" style="text-transform:none;letter-spacing:0">
          <input type="checkbox" id="live">
          <span>Live retrieval <span class="src">· PubMed + Scopus + OpenAlex + Google Scholar + arXiv + Semantic Scholar + IEEE&nbsp;(Scopus/IEEE/Scholar need API keys)</span></span>
      </div>
      <div class="field">
        <label class="toggle" style="text-transform:none;letter-spacing:0">
          <input type="checkbox" id="llm">
          <span>LLM-enhanced reasoning <span class="src">· screening, extraction &amp; abstract writing via OpenRouter (needs OPENROUTER_API_KEY)</span></span>
        </label>
        </label>
      </div>
      <div class="field">
        <label>Simulated tool failures</label>
        <div class="slider-row">
          <input type="range" id="failureRate" min="0" max="60" value="0" step="10"
                 oninput="$('frLabel').textContent=this.value+'%'">
          <b id="frLabel">0%</b>
        </div>
      </div>
      <button class="btn btn-primary" onclick="submitRun()">Run agent</button>
    </div>

    <div class="runshdr"><h2>Runs</h2><span class="src" id="runCount"></span></div>
    <div class="filters">
      <span class="fchip on" data-f="all" onclick="setFilter('all')">All</span>
      <span class="fchip" data-f="pending" onclick="setFilter('pending')">Needs approval</span>
      <span class="fchip" data-f="done" onclick="setFilter('done')">Completed</span>
      <span class="fchip" data-f="ended" onclick="setFilter('ended')">Ended</span>
    </div>
    <ul class="runlist" id="runList"></ul>
  </aside>

  <main>
    <div id="detail"><div class="empty">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.5"><path d="M12 3l7 3v6c0 4.5-3 7.5-7 9-4-1.5-7-4.5-7-9V6l7-3z" stroke-linejoin="round"/></svg>
      <h3>No run selected</h3>
      Start a run from the left panel. Runs pause here when a human decision is required.
    </div></div>
  </main>
</div>
<div class="toast" id="toast"></div>

<script>
const $ = id => document.getElementById(id);
let runs = [], selected = null, lastDetail = null, curTab = "overview", curFilter = "all";

/* ---------- theme ---------- */
const SUN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
const MOON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" stroke-linejoin="round"/></svg>';
function setTheme(t) {
  document.body.closest("html").dataset.theme = t;
  $("themeBtn").innerHTML = t === "dark" ? SUN : MOON;
  localStorage.setItem("medai-theme", t);
}
$("themeBtn").onclick = () =>
    setTheme(document.documentElement.dataset.theme === "dark" ? "light" : "dark");
setTheme(localStorage.getItem("medai-theme") ||
         (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"));

/* ---------- helpers ---------- */
function esc(s) { const d = document.createElement("div"); d.textContent = s ?? ""; return d.innerHTML; }
function ago(ts) {
  const s = Math.floor(Date.now() / 1000 - ts);
  if (s < 60) return "just now";
  if (s < 3600) return Math.floor(s / 60) + "m ago";
  if (s < 86400) return Math.floor(s / 3600) + "h ago";
  return Math.floor(s / 86400) + "d ago";
}
function toast(msg) {
  const t = $("toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove("show"), 2600);
}
async function api(path, opts) {
  const r = await fetch(path, opts);
  if (!r.ok) throw new Error((await r.json()).detail || r.statusText);
  return r.json();
}
function statusGroup(s) {
  if (s === "pending_approval") return "pending";
  if (s === "ok") return "done";
  if (["running", "resuming"].includes(s)) return "active";
  return "ended";   // declined / no_evidence / no_extractable_evidence / failed:* / error
}
function pill(s) {
  const g = statusGroup(s);
  const cls = {pending:"p-pend", done:"p-ok", bad:"p-bad", active:"p-run", ended:"p-end"}[g] || "p-end";
  return `<span class="pill ${cls}"><span class="dot"></span>${esc(s.replaceAll("_"," "))}</span>`;
}
function citeLink(id) {
  if (id.startsWith("PMID:")) return `https://pubmed.ncbi.nlm.nih.gov/${id.slice(5)}/`;
  if (id.startsWith("DOI:"))  return `https://doi.org/${id.slice(4)}`;
  if (id.startsWith("OAW:"))  return `https://openalex.org/${id.slice(4)}`;
  if (id.startsWith("ARXIV:")) return `https://arxiv.org/abs/${id.slice(6)}`;
  if (id.startsWith("IEEE:"))  return `https://ieeexplore.ieee.org/document/${id.slice(5)}`;
  if (id.startsWith("SCOPUS:")) return `https://www.scopus.com/record/display.uri?origin=inward&documentId=${id.slice(7)}`;
  if (id.startsWith("S2:"))   return `https://www.semanticscholar.org/paper/${id.slice(3)}`;
  return null;
}
function paperLink(id, text, url) {
  const href = url || citeLink(id);
  return href ? `<a class="plink" href="${href}" target="_blank" rel="noopener">${esc(text)}</a>`
              : `<span>${esc(text)}</span>`;
}
function fmtEffect(e) {
  const label = {hr:"HR", or:"OR", rr:"RR", md:"MD"}[e.measure] || String(e.measure).toUpperCase();
  const f = v => Math.round(v * 1000) / 1000;
  return `${label} ${f(e.point)} (95% CI ${f(e.lo)} to ${f(e.hi)})`;
}

/* ---------- actions ---------- */
async function submitRun() {
  try {
    const body = { query: $("query").value.trim() || "aspirin myocardial infarction risk",
                   live: $("live").checked,
                   failure_rate: Number($("failureRate").value) / 100,
                   llm: $("llm").checked ? {screen:true, extract:true, write:true} : null };
    const r = await api("/runs", { method:"POST",
        headers:{"Content-Type":"application/json"}, body: JSON.stringify(body) });
    selected = r.run_id; curTab = "overview";
    toast("Run started · " + r.run_id);
    refreshRuns();
  } catch (e) { toast(e.message); }
}
async function decide(approved) {
  const el = $("approverName");
  const approver = (el && el.value.trim()) || "web-reviewer";
  try {
    await api(`/runs/${selected}/approval`, { method:"POST",
        headers:{"Content-Type":"application/json"},
        body: JSON.stringify({approved, approver}) });
    toast(approved ? "Approved — resuming analysis" : "Declined — sensitive tool blocked");
    refreshDetail();
  } catch (e) { toast(e.message); }
}
function setFilter(f) {
  curFilter = f;
  document.querySelectorAll(".fchip").forEach(c => c.classList.toggle("on", c.dataset.f === f));
  renderRuns(runs);
}
function pickRun(id) { selected = id; curTab = "overview"; refreshRuns(); refreshDetail(); }
function setTab(t) { curTab = t; if (lastDetail) renderDetail(lastDetail); }

/* ---------- rendering ---------- */
function renderRuns(all) {
  const groups = { all: () => true,
                   pending: r => statusGroup(r.status) === "pending",
                   done: r => statusGroup(r.status) === "done",
                   ended: r => statusGroup(r.status) === "ended" };
  const list = all.filter(groups[curFilter]);
  $("runCount").textContent = all.length ? `${all.length} total` : "";
  const ul = $("runList");
  if (!list.length) { ul.innerHTML = `<li style="cursor:default;color:var(--muted);font-size:12.5px">No runs in this view</li>`; return; }
  ul.innerHTML = "";
  for (const r of list) {
    const li = document.createElement("li");
    if (r.run_id === selected) li.className = "sel";
    const armed = confirmDel && confirmDel.id === r.run_id && Date.now() - confirmDel.at < 4000;
    li.innerHTML = `<div class="rq">${esc(r.query)}${r.live ? " · live" : ""}</div>
                    <div class="rm"><span>${ago(r.created)}</span>
                      <span class="right">${pill(r.status)}
                        <button class="del ${armed ? "confirm" : ""}" title="Delete run"
                          onclick="delClick(event,'${r.run_id}')">${armed ? "Sure?" : TRASH}</button>
                      </span></div>`;
    li.onclick = () => pickRun(r.run_id);
    ul.appendChild(li);
  }
}

const CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke-width="3"><path d="M5 13l4 4L19 7" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const X = '<svg viewBox="0 0 24 24" fill="none" stroke-width="3"><path d="M6 6l12 12M18 6L6 18" stroke-linecap="round"/></svg>';
const TRASH = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h16M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2m3 0v12a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2V7" stroke-linecap="round" stroke-linejoin="round"/></svg>';

/* two-step delete confirmation: first click arms, second (within 4s) deletes */
let confirmDel = null;
function delClick(ev, id) {
  ev?.stopPropagation?.();
  const armed = confirmDel && confirmDel.id === id && Date.now() - confirmDel.at < 4000;
  if (armed) { doDelete(id); return; }
  confirmDel = { id, at: Date.now() };
  if (lastDetail && lastDetail.run_id === id) renderDetail(lastDetail);
  renderRuns(runs);
  setTimeout(() => {
    if (confirmDel && confirmDel.id === id) {
      confirmDel = null;
      renderRuns(runs);
      if (lastDetail && lastDetail.run_id === id) renderDetail(lastDetail);
    }
  }, 4200);
}
async function doDelete(id) {
  try {
    await api(`/runs/${id}`, { method: "DELETE" });
    confirmDel = null;
    toast("Run deleted · audit trail removed with it");
    if (selected === id) {
      selected = null; lastDetail = null;
      $("detail").innerHTML = `<div class="empty">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.5"><path d="M12 3l7 3v6c0 4.5-3 7.5-7 9-4-1.5-7-4.5-7-9V6l7-3z" stroke-linejoin="round"/></svg>
        <h3>Run deleted</h3>Start a run from the left panel.</div>`;
    }
    refreshRuns();
  } catch (e) { toast(e.message); }
}

function stages(d) {
  const ev = d.events, has = k => ev.some(e => e.kind === k);
  const tool = t => ev.some(e => e.kind === "tool_call" && e.tool === t);
  const done = { retrieve: has("retrieval_mode") || has("no_evidence"),
                 extract:  tool("extract_evidence") || has("no_extractable_evidence"),
                 approve:  has("approval_decision"),
                 analyze:  tool("run_meta_analysis"),
                 verify:   has("citation_verification"),
                 report:   has("report") || ["ok","declined","no_evidence",
                            "no_extractable_evidence","error"].includes(d.status) };
  const st = {};
  for (const k of Object.keys(done)) st[k] = done[k] ? "done" : "pending";
  if (d.status === "no_evidence") st.retrieve = "fail";
  if (d.status === "no_extractable_evidence") { st.retrieve = "done"; st.extract = "fail"; }
  if (d.status === "declined") st.approve = "fail";
  if (d.status === "error" || d.status.startsWith("failed")) {
    for (const k of Object.keys(st)) if (st[k] === "pending") { st[k] = "fail"; break; }
  }
  if (["running", "resuming"].includes(d.status)) {
    const next = Object.keys(st).find(k => st[k] === "pending");
    if (next) st[next] = "act";
  }
  if (d.status === "pending_approval") st.approve = "act";
  return st;
}

function linkifyRefs(text, papers) {
  // turn [n] markers into links pointing at the referenced paper
  return esc(text).replace(/\[(\d+)\]/g, (m, n) => {
    const p = papers[Number(n) - 1];
    const href = p ? citeLink(p.id) : null;
    return href ? `<a class="plink" href="${href}" target="_blank" rel="noopener">[${n}]</a>`
                : `<span class="cite-n">[${n}]</span>`;
  });
}

function synthesisCards(d) {
  if (!d.synthesis) return "";
  const s = d.synthesis;
  let html;
  if (s.abstract_sections) {
    html = `<div class="card"><h3>Combined abstract — all papers synthesized (structured)</h3>` +
      s.abstract_sections.map(sec =>
        `<div class="review-sub">${esc(sec.label)}</div>` +
        `<p class="review-p">${linkifyRefs(sec.text, d.papers)}</p>`).join("") + `</div>`;
  } else {
    html = `<div class="card"><h3>Combined abstract — all papers synthesized</h3>
      <p class="abstract-p">${linkifyRefs(s.abstract, d.papers)}</p></div>`;
  }
  if (s.outline && s.outline.length) {
    html += `<div class="card"><h3>Agent-generated review outline</h3>` +
      s.outline.map(sec => `<div class="outline-h">${esc(sec.heading)}</div>` +
        sec.bullets.map(b => `<div class="outline-b">• ${linkifyRefs(b, d.papers)}</div>`).join("")
      ).join("") + `</div>`;
  }
  return html;
}

function evidenceAnalysisCard(d) {
  const a = d.analysis;
  if (!a || !d.evidence || !d.evidence.length) return "";
  const ratio = a.effect_measure === "ratio";
  const nullV = ratio ? 1 : 0;
  const tf = v => ratio ? Math.log(v) : v;
  const fb = v => ratio ? Math.exp(v) : v;
  const f3 = v => Math.round(v * 1000) / 1000;
  const rows = d.evidence.map(e => {
    const se = ratio ? (Math.log(e.hi) - Math.log(e.lo)) / 3.92 : (e.hi - e.lo) / 3.92;
    const idx = d.papers.findIndex(p => p.id === e.paper_id);
    return { ...e, se, ref: idx + 1, title: (d.papers[idx] || {}).title || e.paper_id };
  });
  const maxSe = Math.max(...rows.map(r => r.se));

  // ---- funnel plot: effect vs precision, inverted axis --------------------
  const fw = 700, fm = 56, flw = 10, fvw = 10;
  let fxLo = Math.min(...rows.map(r => tf(r.point)), tf(nullV), tf(a.pooled_point));
  let fxHi = Math.max(...rows.map(r => tf(r.point)), tf(nullV), tf(a.pooled_point));
  const fxPad = (fxHi - fxLo) * 0.12 || 0.1; fxLo -= fxPad; fxHi += fxPad;
  const seY = maxSe * 1.15;
  const fH = 40 + seY / maxSe * 160 + 34;
  const FX = v => fm + flw + ((v - fxLo) / (fxHi - fxLo)) * (fw - fm - flw - fvw);
  const FY = se => 22 + (se / seY) * (fH - 62);
  let fs = `<svg class="ea-plot" viewBox="0 0 ${fw} ${fH}" width="100%" style="min-width:560px">`;
  fs += `<polygon class="funnel-region" points="${FX(tf(nullV))},${FY(0)} ${FX(tf(nullV) - 1.96 * seY)},${FY(seY)} ${FX(tf(nullV) + 1.96 * seY)},${FY(seY)}"/>`;
  fs += `<line class="pooled-line" x1="${FX(tf(a.pooled_point))}" y1="${FY(0)}" x2="${FX(tf(a.pooled_point))}" y2="${FY(seY)}"/>`;
  fs += `<line class="ref-line" x1="${fm + flw}" y1="${FY(seY)}" x2="${fw - fvw}" y2="${FY(seY)}"/>`;
  for (const r of rows) {
    fs += `<rect class="study-dot" x="${FX(tf(r.point)) - 3.5}" y="${FY(r.se) - 3.5}" width="7" height="7" rx="1.5"/>`;
    fs += `<text class="axis-label" x="${FX(tf(r.point))}" y="${FY(r.se) + 14}" text-anchor="middle">[${r.ref}]</text>`;
  }
  for (const frac of [0.15, 0.5, 0.85]) {
    const v = fxLo + (fxHi - fxLo) * frac;
    fs += `<text class="axis-label" x="${FX(v)}" y="${fH - 6}" text-anchor="middle">${f3(fb(v))}</text>`;
  }
  fs += `<text class="axis-label" x="${FX(tf(nullV))}" y="12" text-anchor="middle">null = ${nullV}</text>`;
  fs += `</svg>`;
  const funnelCard = `<div class="card"><h3>Funnel plot — publication bias check</h3>
    <div class="forest-wrap">${fs}</div>
    <div class="ea-verdict">${a.egger ?
      `Egger's regression test: intercept = ${esc(String(a.egger.intercept))}, p = ${esc(String(a.egger.p_value))} (k = ${a.egger.n}) — ` +
      (a.egger.asymmetry
        ? `<b class="asym">funnel asymmetry detected — small-study effects possible; treat the pooled estimate as provisional.</b>`
        : `<b class="sig">no evidence of small-study effects.</b>`)
      : `Too few studies (&lt;3) for Egger's test — interpret funnel symmetry visually.`}</div></div>`;

  // ---- leave-one-out influence analysis ------------------------------------
  const loo = a.leave_one_out || [];
  let looCard = "";
  if (loo.length) {
    const overallSig = !!(a.ci_lo > nullV || a.ci_hi < nullV);
    const lRows = loo.map(r => ({ ...r, lo: tf(r.ci_lo), hi: tf(r.ci_hi), y: tf(r.point) }))
                     .sort((p, q) => p.y - q.y);
    let lLo = Math.min(...lRows.map(r => r.lo), tf(a.pooled_point));
    let lHi = Math.max(...lRows.map(r => r.hi), tf(a.pooled_point));
    const lpad = (lHi - lLo) * 0.1 || 0.1; lLo -= lpad; lHi += lpad;
    const LW = 700, LL = 170, LV = 150, rowH = 26;
    const LH = 24 + rowH * lRows.length + 30;
    const LX = v => LL + ((v - lLo) / (lHi - lLo)) * (LW - LL - LV);
    let ls = `<svg class="ea-plot" viewBox="0 0 ${LW} ${LH}" width="100%" style="min-width:560px">`;
    ls += `<line class="ref-line" x1="${LX(tf(nullV))}" y1="14" x2="${LX(tf(nullV))}" y2="${LH - 24}"/>`;
    ls += `<line class="pooled-line" x1="${LX(tf(a.pooled_point))}" y1="14" x2="${LX(tf(a.pooled_point))}" y2="${LH - 24}"/>`;
    ls += `<text class="axis-label" x="${LX(tf(nullV))}" y="${LH - 8}" text-anchor="middle">no effect</text>`;
    ls += `<text class="axis-label" x="${LX(tf(a.pooled_point))}" y="10" text-anchor="middle">all studies: ${f3(a.pooled_point)}</text>`;
    lRows.forEach((r, i) => {
      const y = 30 + i * rowH;
      const flips = overallSig !== (r.ci_lo > nullV || r.ci_hi < nullV);
      const rid = d.papers.findIndex(p => p.id === r.excluded_paper_id) + 1;
      ls += `<text class="study-label" x="${LL - 10}" y="${y + 4}" text-anchor="end">without [${rid}]</text>`;
      ls += `<line class="loo-line" x1="${LX(r.lo)}" y1="${y}" x2="${LX(r.hi)}" y2="${y}"/>`;
      ls += `<rect class="loo-dot" x="${LX(r.y) - 3}" y="${y - 3}" width="6" height="6"/>`;
      ls += `<text class="val-label" x="${LW - LV + 16}" y="${y + 4}">${f3(r.point)} [${f3(r.ci_lo)}, ${f3(r.ci_hi)}]</text>`;
      if (flips) ls += `<text class="flip" x="${LW - LV + 16}" y="${y + 16}">flips significance</text>`;
    });
    ls += `</svg>`;
    const flips = lRows.filter(r => overallSig !== (r.ci_lo > nullV || r.ci_hi < nullV)).length;
    const verdict = flips
      ? `<b class="asym">${flips} exclusion${flips > 1 ? "s" : ""} change the significance</b> — the result depends on those studies; name them in the limitations.`
      : `<b class="sig">No single study changes the conclusion</b> — the result is robust to any one exclusion.`;
    looCard = `<div class="card"><h3>Leave-one-out sensitivity — influence of each study</h3>
      <div class="forest-wrap">${ls}</div>
      <div class="ea-verdict">${verdict}</div></div>`;
  }

  return funnelCard + looCard;
}

function prismaFlowSVG(f) {
  // PRISMA 2020-style flow: main column (x 20..400) + exclusion side column
  // (x 455..705). Heights are computed from content so nothing overlaps.
  const mainX = 20, mainW = 380, sideX = 455, sideW = 250;
  const chunk = (arr, n) => { const out = []; for (let i = 0; i < arr.length; i += n) out.push(arr.slice(i, i + n)); return out; };
  const P = [];
  let yy = 10;

  const idLines = chunk(f.identified.map(x => `${x.database}: ${x.n}`), 3);
  const hId = 34 + idLines.length * 15;
  P.push(`<rect class="flow-box" x="${mainX}" y="${yy}" width="${mainW}" height="${hId}" rx="9"/>`);
  P.push(`<text class="flow-text" x="${mainX + 14}" y="${yy + 20}">Records identified (n = ${f.identified.reduce((s, x) => s + x.n, 0)})</text>`);
  idLines.forEach((ln, i) =>
    P.push(`<text class="flow-sub" x="${mainX + 14}" y="${yy + 37 + i * 15}">${esc(ln.join("  ·  "))}</text>`));
  if (f.unavailable.length) {
    const unl = chunk(f.unavailable, 2);
    const hU = 34 + unl.length * 15;
    P.push(`<line class="flow-arrow" x1="${mainX + mainW}" y1="${yy + hId / 2}" x2="${sideX}" y2="${yy + hId / 2}" stroke-dasharray="3 3"/>`);
    P.push(`<rect class="flow-side" x="${sideX}" y="${yy}" width="${sideW}" height="${hU}" rx="9"/>`);
    P.push(`<text class="flow-excl" x="${sideX + 12}" y="${yy + 20}">Not retrieved</text>`);
    unl.forEach((ln, i) =>
      P.push(`<text class="flow-sub" x="${sideX + 12}" y="${yy + 37 + i * 15}">${esc(ln.join(", "))}</text>`));
  }
  yy += hId;

  const row = (title, sub, side) => {
    yy += 36;
    P.push(`<line class="flow-arrow" x1="${mainX + mainW / 2}" y1="${yy - 32}" x2="${mainX + mainW / 2}" y2="${yy}"/>`);
    const h = sub ? 52 : 40;
    P.push(`<rect class="flow-box" x="${mainX}" y="${yy}" width="${mainW}" height="${h}" rx="9"/>`);
    P.push(`<text class="flow-text" x="${mainX + 14}" y="${yy + 21}">${esc(title)}</text>`);
    if (sub) P.push(`<text class="flow-sub" x="${mainX + 14}" y="${yy + 39}">${esc(sub)}</text>`);
    if (side) {
      P.push(`<line class="flow-arrow" x1="${mainX + mainW}" y1="${yy + h / 2}" x2="${sideX}" y2="${yy + h / 2}" stroke-dasharray="3 3"/>`);
      P.push(`<rect class="flow-side" x="${sideX}" y="${yy}" width="${sideW}" height="${h}" rx="9"/>`);
      P.push(`<text class="flow-excl" x="${sideX + 12}" y="${yy + 21}">${esc(side[0])}</text>`);
      if (side[1]) P.push(`<text class="flow-sub" x="${sideX + 12}" y="${yy + 39}">${esc(side[1])}</text>`);
    }
    yy += h;
  };

  row("Records after duplicates removed", `n = ${f.screened}  ·  ${f.duplicates_removed} duplicates removed`);
  row("Records screened", null, ["Excluded by relevance screen", `n = ${f.excluded}`]);
  row("Studies included in review",
      `${f.included} studies · ${f.effect_estimates} effect estimates from ${f.with_effects} papers`);

  return `<svg viewBox="0 0 720 ${yy + 12}" width="100%" style="max-width:680px">${P.join("")}</svg>`;
}

function reviewCard(d) {
  const r = d.review;
  if (!r) return "";
  const f = r.prisma;
  const flowSvg = prismaFlowSVG(f);
  const mdBtn = `<button class="btn" style="padding:5px 12px;font-size:12px"
      onclick="downloadReview()">download .md manuscript</button>`;

  const methodsHtml = `<div class="review-sec">Methods</div>` +
    `<div class="review-sub">Search strategy (executed ${esc(r.generated_at)})</div>` +
    r.methods.search_strategy.map(m => `<div class="review-li"><b>${esc(m.database)}:</b> <code>${esc(m.query)}</code></div>`).join("") +
    `<div class="review-sub">Eligibility criteria</div>` +
    r.methods.eligibility.map(x => `<div class="review-li">• ${esc(x)}</div>`).join("") +
    `<div class="review-sub">Data extraction</div><div class="review-p">${esc(r.methods.extraction)}</div>` +
    `<div class="review-sub">Synthesis</div><div class="review-p">${esc(r.methods.synthesis)}</div>`;

  const resultsHtml = `<div class="review-sec">Results</div>` +
    `<div class="review-sub">Study characteristics</div>` +
    `<table>${r.results.study_characteristics.map(c => {
      const href = citeLink(c.id);
      const link = href ? `<a class="plink" href="${href}" target="_blank" rel="noopener">${esc(c.id)}</a>` : esc(c.id);
      return `<tr><td class="k">[${c.n}] ${link}<br><span class="srcb">${esc(c.source)}</span></td>
        <td>${esc(c.title)}${c.effect ? `<div class="eff">Extracted: ${esc(c.effect)}</div>` : ""}</td></tr>`;
    }).join("")}</table>` +
    (r.results.synthesis
      ? `<div class="review-sub">Quantitative synthesis</div>
         <div class="review-p">Pooled estimate ${esc(String(r.results.synthesis.pooled_point))}
         (95% CI ${esc(String(r.results.synthesis.ci_lo))} to ${esc(String(r.results.synthesis.ci_hi))}),
         ${esc(r.results.synthesis.model)} model, k=${esc(String(r.results.synthesis.k))},
         I²=${esc(String(r.results.synthesis.I2))}%, τ²=${esc(String(r.results.synthesis.tau2))}.
         A fixed-effect sensitivity anchor is reported in the Evidence analysis tab.</div>`
      : `<div class="review-p">${esc(r.results.narrative)}</div>`);

  const refsHtml = `<div class="review-sec">References</div>` +
    `<ol class="refs">` + r.references.map(x => {
      const href = citeLink(x.id);
      const link = href ? `<a class="plink" href="${href}" target="_blank" rel="noopener">${esc(x.title)}</a>` : esc(x.title);
      return `<li>${link} <span class="srcb">${esc(x.source)}</span> <span class="cite-n">${esc(x.id)}</span></li>`;
    }).join("") + `</ol>`;

  const keyPointsHtml = `<div class="review-sec">Key points</div>` +
    ((r.results.key_points || []).map(h => {
      const href = citeLink(h.id);
      const t = href ? `<a class="plink" href="${href}" target="_blank" rel="noopener">${esc(h.title)}</a>` : esc(h.title);
      return `<div class="outline-h">[${h.ref}] ${t}</div>` +
        h.highlights.map(b => `<div class="outline-b">• ${esc(b)}</div>`).join("");
    }).join(""));

  return `<div class="card">
    <p class="review-title">${esc(r.title)}</p>
    <div class="review-meta">Generated ${esc(r.generated_at)} · automated rapid review, human-approved synthesis · ${mdBtn}</div>
    <div class="review-sec">Structured abstract</div>
    <div class="review-sub">Background</div><div class="review-p">${esc(r.abstract.background)}</div>
    <div class="review-sub">Objective</div><div class="review-p">${esc(r.abstract.objective || "")}</div>
    <div class="review-sub">Methods</div><div class="review-p">${esc(r.abstract.methods)}</div>
    <div class="review-sub">Results</div><div class="review-p">${esc(r.abstract.results)}</div>
    <div class="review-sub">Conclusions</div><div class="review-p">${esc(r.abstract.conclusions)}</div>
    <div class="review-sec">PRISMA flow</div>
    <div class="forest-wrap">${flowSvg}</div>
    ${methodsHtml}
    ${resultsHtml}
    ${keyPointsHtml}
    <div class="review-sec">Discussion</div>
    ${r.discussion.map(x => `<div class="review-p">• ${esc(x)}</div>`).join("")}
    <div class="review-sec">Limitations</div>
    ${r.limitations.map(x => `<div class="review-li">• ${esc(x)}</div>`).join("")}
    <div class="review-sec">Conclusion</div>
    <div class="review-p">${esc(r.conclusion)}</div>
    ${refsHtml}
  </div>`;
}

function downloadReview() {
  const r = lastDetail && lastDetail.review;
  if (!r) return;
  const L = [];
  L.push("# " + r.title, "", "*" + r.generated_at + "* — automated rapid review, human-approved synthesis.", "");
  L.push("## Structured abstract", "", "**Background.** " + r.abstract.background,
         "", "**Objective.** " + (r.abstract.objective || ""),
         "", "**Methods.** " + r.abstract.methods, "",
         "**Results.** " + r.abstract.results, "", "**Conclusions.** " + r.abstract.conclusions, "");
  L.push("## PRISMA flow", "", "```", "Identified: " +
         r.prisma.identified.map(x => x.database + " " + x.n).join(" | ") +
         (r.prisma.unavailable.length ? "  (unavailable: " + r.prisma.unavailable.join(", ") + ")" : ""),
         "After duplicates removed: " + r.prisma.screened + " (" + r.prisma.duplicates_removed + " duplicates)",
         "Screened: " + r.prisma.screened + "  -> excluded: " + r.prisma.excluded,
         "Included in review: " + r.prisma.included +
         "  (" + r.prisma.effect_estimates + " effect estimates from " + r.prisma.with_effects + " studies)", "```", "");
  L.push("## Methods", "", "### Search strategy");
  r.methods.search_strategy.forEach(m => L.push("- **" + m.database + ":** `" + m.query + "`"));
  L.push("", "### Eligibility criteria");
  r.methods.eligibility.forEach(x => L.push("- " + x));
  L.push("", "### Data extraction", r.methods.extraction, "", "### Synthesis", r.methods.synthesis, "");
  L.push("## Results", "", "### Study characteristics", "",
         "| Ref | ID | Source | Title | Extracted effect |", "|---|---|---|---|---|");
  r.results.study_characteristics.forEach(c =>
    L.push("| [" + c.n + "] | " + c.id + " | " + c.source + " | " + c.title + " | " + (c.effect || "—") + " |"));
  if (r.results.synthesis) {
    const s = r.results.synthesis;
    L.push("", "### Quantitative synthesis", "",
      "Pooled estimate **" + s.pooled_point + "** (95% CI " + s.ci_lo + " to " + s.ci_hi +
      "), " + s.model + " model, k=" + s.k + ", I²=" + s.I2 + "%, τ²=" + s.tau2 + ".");
  } else if (r.results.narrative) {
    L.push("", "### Synthesis", "", r.results.narrative);
  }
  L.push("", "## Key points");
  (r.results.key_points || []).forEach(h => {
    L.push("", "**[" + h.ref + "] " + h.title + "**");
    h.highlights.forEach(b => L.push("- " + b));
  });
  L.push("", "## Discussion");
  r.discussion.forEach(x => L.push("- " + x));
  L.push("", "## Limitations");
  r.limitations.forEach(x => L.push("- " + x));
  L.push("", "## Conclusion", "", r.conclusion, "", "## References");
  r.references.forEach(x => L.push("[" + x.n + "] " + x.title + " — " + x.source + " (" + x.id + ")"));
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([L.join("\n")], {type:"text/markdown"}));
  a.download = "review-" + (lastDetail ? lastDetail.run_id : "run") + ".md";
  a.click();
}

function highlightsCard(d) {
  const hl = (d.synthesis || {}).highlights;
  if (!hl || !hl.length) return "";
  return `<div class="card"><h3>Key highlights — each paper, bullet by bullet</h3>` +
    hl.map(h => {
      const href = citeLink(h.id);
      const t = href ? `<a class="plink" href="${href}" target="_blank" rel="noopener">${esc(h.title)}</a>` : esc(h.title);
      return `<div class="outline-h">[${h.ref}] ${t} <span class="srcb">${esc(h.source)}</span></div>` +
        h.highlights.map(b => `<div class="outline-b">• ${linkifyRefs(b, d.papers)}</div>`).join("");
    }).join("") + `</div>`;
}

function overviewCard(d) {
  if (!d.papers || !d.papers.length) return "";
  const byPaper = {};
  (d.evidence || []).forEach(e => (byPaper[e.paper_id] ||= []).push(e));
  const contributed = d.papers.map((p, i) => byPaper[p.id] ? i + 1 : null).filter(x => x);
  const srcList = [...new Set(d.papers.map(p => p.source))].join(" + ");
  let lead = `This run retrieved <b>${d.papers.length}</b> papers via ${esc(srcList)}. `;
  if ((d.evidence || []).length) {
    lead += `<b>${d.evidence.length}</b> effect estimates were extracted from ` +
            `${Object.keys(byPaper).length} of them`;
    if (d.status === "ok" && d.citations.length) lead += `; pooling them produced the result above`;
    lead += `. Contributing references: ` +
            contributed.map(n => `<span class="cite-n">[${n}]</span>`).join(" ") + `.`;
  } else {
    lead += `None of their abstracts reported a poolable effect estimate (see outcome above).`;
  }
  const items = d.papers.map((p, i) => {
    const effs = (byPaper[p.id] || []).map(fmtEffect).join("  ·  ");
    const href = citeLink(p.id);
    return `<li>
      ${paperLink(p.id, p.title || p.id)} <span class="srcb">${esc(p.source)}</span> <span class="cite-n">[${i + 1}]</span>
      ${effs ? `<div class="eff">Extracted: ${esc(effs)}</div>`
             : `<div class="noeff">no poolable effect estimate in the abstract</div>`}
      ${p.abstract_snippet ? `<div class="snippet">“${esc(p.abstract_snippet)}…” ${href ? `<a class="plink" href="${href}" target="_blank" rel="noopener">read →</a>` : ""}</div>` : ""}
    </li>`;
  }).join("");
  return `<div class="card"><h3>Paper-by-paper breakdown — all ${d.papers.length} retrieved papers</h3>
    <p class="report">${lead}</p><ol class="refs">${items}</ol></div>`;
}

function renderDetail(d) {
  const el = $("detail");
  const prevApprover = document.getElementById("approverName")?.value;  // survives poll re-render
  const st = stages(d);
  const stageDefs = [["retrieve","Retrieve"],["extract","Extract"],["approve","Approval"],
                     ["analyze","Analyze"],["verify","Verify"],["report","Report"]];
  const stepper = `<div class="card"><h3>Pipeline</h3><div class="stepper">
    ${stageDefs.map(([k, lbl]) => {
      const s = st[k];
      const node = s === "done" ? CHECK : s === "fail" ? X : (s === "act" ? "•" : "");
      return `<div class="step ${s}"><div class="node">${node}</div><div class="lbl">${lbl}</div></div>`;
    }).join("")}</div></div>`;

  let body = "";
  if (d.status === "pending_approval" && d.pending.length) {
    const p = d.pending[0].payload;
    body = `<div class="card approval">
      <div class="badge-ico">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 9v4M12 17h.01M10.3 3.9L1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Human decision required — the run is paused
      </div>
      <div class="kv">
        <b>Action</b><span>${esc(p.action)}</span>
        <b>Why sensitive</b><span>${esc(p.why)}</span>
        <b>Query</b><span>${esc(p.query)}</span>
        <b>Papers retrieved</b><span>${esc(p.papers)}</span>
        <b>Effects extracted</b><span>${esc(p.effects)}</span>
      </div>
      <div class="sig field">
        <label>Your name (recorded in the audit log)</label>
        <input type="text" id="approverName" value="reviewer"
               onkeydown="if(event.key==='Enter')decide(true)">
      </div>
      <div class="btnrow">
        <button class="btn btn-ok" onclick="decide(true)">Approve analysis</button>
        <button class="btn btn-bad" onclick="decide(false)">Decline</button>
      </div>
    </div>`;
  } else if (d.status === "ok") {
    body = `<div class="card"><h3>Result</h3>
      <div class="report big">${esc(d.report)}</div>
      <div class="cites">${d.citations.map(c => {
        const href = citeLink(c);
        return href ? `<a href="${href}" target="_blank" rel="noopener">${esc(c)}</a>`
                    : `<a>${esc(c)}</a>`; }).join("")}</div></div>`;
  } else if (["declined", "no_evidence", "no_extractable_evidence"].includes(d.status)) {
    body = `<div class="card"><h3>Outcome</h3><div class="note">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16h.01" stroke-linecap="round"/></svg>
      <span>${esc(d.report)}</span></div></div>`;
  } else if (d.status === "error" || d.status.startsWith("failed")) {
    body = `<div class="card"><h3>Run failed</h3><div class="note">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M15 9l-6 6M9 9l6 6" stroke-linecap="round"/></svg>
      <span><b style="color:var(--bad)">${esc(d.status)}</b> — ${esc(d.error || "see audit log")}.<br>
      The agent failed loudly instead of reporting an unverifiable result.</span></div></div>`;
  } else {
    body = `<div class="card"><div class="empty" style="min-height:120px">
      <div><h3>Working…</h3>retrieving and extracting evidence</div></div></div>`;
  }

  const hasEA = (d.evidence || []).length > 0 && !!d.analysis;
  let viewTab = (curTab === "evidence" && !hasEA) ? "overview" : curTab;
  if (viewTab === "review" && !d.review) viewTab = "overview";
  const tabDefs = [["overview", "Overview"]];
  if (hasEA) tabDefs.push(["evidence", `Evidence analysis (${d.evidence.length})`]);
  tabDefs.push(["papers", `Papers (${d.papers.length})`], ["audit", `Audit log (${d.events.length})`]);
  if (d.review) tabDefs.splice(hasEA ? 2 : 1, 0, ["review", "Review article"]);
  const tabs = `
    <div class="tabs">
      ${tabDefs.map(([t, label]) =>
        `<button class="tab ${viewTab === t ? "on" : ""}" onclick="setTab('${t}')">${label}</button>`).join("")}
    </div>`;

  let tabBody = "";
  if (curTab === "papers") {
    tabBody = d.papers.length ? `<div class="card"><table>
      <tr><th style="width:230px">Paper (click to read)</th><th>Title & abstract</th></tr>
      ${d.papers.map(p => `<tr>
        <td class="k">${paperLink(p.id, p.id, p.url)}<br><span class="srcb">${esc(p.source)}</span></td>
        <td>${paperLink(p.id, p.title || p.id, p.url)}
            ${p.abstract_snippet ? `<div class="snippet">“${esc(p.abstract_snippet)}…”</div>` : ""}</td></tr>`).join("")}
      </table></div>`
      : `<div class="card"><div class="hint">No paper list recorded for this run yet.</div></div>`;
  } else if (curTab === "audit") {
    tabBody = `<div class="card">
      <p style="margin:0 0 10px">Chain integrity:
        <span class="badge ${d.audit_ok ? "ok" : "bad"}">${d.audit_ok ? "intact ✓" : "TAMPERED"}</span>
        <button class="btn" style="margin-left:10px;padding:5px 12px;font-size:12px"
          onclick="downloadAudit()">download .jsonl</button></p>
      <table><tr><th>#</th><th>time</th><th>event</th><th>detail</th></tr>
      ${d.events.map(e => {
        const {seq, ts, kind, run_id, hash, prev_hash, ...rest} = e;
        const detail = JSON.stringify(rest);
        return `<tr><td class="k">${seq}</td><td class="d">${new Date(ts * 1000).toLocaleTimeString()}</td>
          <td class="k">${esc(kind)}</td>
          <td class="d">${esc(detail.length > 140 ? detail.slice(0, 140) + "…" : detail)}</td></tr>`;
      }).join("")}</table></div>`;
  }

  el.innerHTML = `
    <div class="topbar">
      <div>
        <h2>${esc(d.query)}</h2>
        <div class="meta">
          ${pill(d.status)}
          <span class="mchip">${d.live ? "live retrieval" : "offline corpus"}</span>
          ${d.llm ? `<span class="mchip" style="color:var(--accent)">LLM-enhanced</span>` : ""}
          <span class="mchip">failure sim ${Math.round(d.failure_rate * 100)}%</span>
          <span class="mchip">started ${ago(d.created)}</span>
          <span class="mchip">run ${esc(d.run_id)}</span>
        </div>
      </div>
      <div class="spacer"></div>
      <button class="btn-danger-ghost ${confirmDel && confirmDel.id === d.run_id && Date.now() - confirmDel.at < 4000 ? "confirm" : ""}"
              onclick="delClick(event,'${d.run_id}')">${confirmDel && confirmDel.id === d.run_id && Date.now() - confirmDel.at < 4000 ? "Confirm delete?" : TRASH + "Delete run"}</button>
    </div>
    ${stepper}
    ${viewTab === "overview" ? body + synthesisCards(d) + highlightsCard(d) + overviewCard(d) : ""}
    ${viewTab === "evidence" ? evidenceAnalysisCard(d) : ""}
    ${viewTab === "review" ? reviewCard(d) : ""}
    ${tabs}
    ${tabBody}`;
  const inp = document.getElementById("approverName");
  if (inp && prevApprover !== undefined) inp.value = prevApprover;  // restore typed name
  lastDetail = d;
}

function downloadAudit() {
  if (!lastDetail) return;
  const text = lastDetail.events.map(e => JSON.stringify(e)).join("\n") + "\n";
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([text], {type:"application/jsonl"}));
  a.download = `audit-${lastDetail.run_id}.jsonl`;
  a.click();
}

/* ---------- polling ---------- */
async function refreshDetail() {
  if (!selected) return;
  try { renderDetail(await api(`/runs/${selected}`)); }
  catch (e) { toast(e.message); }
}
async function refreshRuns() {
  try { runs = await api("/runs"); renderRuns(runs); if (selected) refreshDetail(); }
  catch (e) { /* server unreachable; keep last view */ }
}
setInterval(refreshRuns, 1500);
refreshRuns();
</script>
</body>
</html>
